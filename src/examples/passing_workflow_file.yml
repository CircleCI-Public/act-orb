description: |
  Skip workflow file generation and pass a pre-existing GitHub Action workflow file to the Act job.

usage:
  version: 2.1
  orbs:
    act: circleci/act@1.0.0
  workflows:
    main:
      jobs:
        - act/act:
            workflow-file: .github/workflows/workflow.yml
            skip-create-workflow-file: true
